
# NeuroWorld AI - Video Prediction Training
# File: training/configs/video_prediction.yaml

experiment:
  name: "video_prediction_training"
  seed: 42

model:
  name: "NeuroWorldVideoPredictor"
  type: "transformer"

  image_channels: 3
  image_size: 128

  latent_dim: 128
  hidden_dim: 256
  num_layers: 4
  num_attention_heads: 8
  dropout: 0.1

  context_frames: 8
  prediction_frames: 4

dataset:
  path: "data/processed/videos"
  image_size: 128
  context_frames: 8
  prediction_frames: 4
  num_workers: 0
  shuffle: true

training:
  epochs: 100
  batch_size: 8
  device: "auto"
  mixed_precision: false
  gradient_accumulation_steps: 1

optimizer:
  name: "adamw"
  learning_rate: 0.0003
  weight_decay: 0.01

scheduler:
  name: "cosine"
  enabled: true

loss:
  reconstruction_weight: 1.0
  temporal_weight: 0.2
  prediction_weight: 1.0
  reduction: "mean"

prediction:
  autoregressive: true
  teacher_forcing: true
  teacher_forcing_ratio: 0.5

validation:
  enabled: true
  monitor: "val_loss"
  mode: "min"

early_stopping:
  enabled: true
  patience: 10
  min_delta: 0.0001

checkpoint:
  directory: "checkpoints/video_prediction"
  save_best: true
  save_last: true

logging:
  enabled: true
  log_dir: "logs/video_prediction"

distributed:
  enabled: false
